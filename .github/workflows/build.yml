name: Build and Test APK

on:
  push:
    branches: [main, feature/tr-accessible-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Builds and tests every push/PR; publishes release APKs only on pushes to `main`.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also checks that the Gradle wrapper jar in the repository is a genuine one.
      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the repository's Actions secrets. Forks and pull requests do
      # not get secrets, so their builds fall back to a throwaway key.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "kind=project key" >> "$GITHUB_OUTPUT"
          else
            echo "kind=throwaway key" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and Build
        id: build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest 2>&1 | tee build.log

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p out
          tail -n 400 build.log > out/build-tail.log || true
          grep -nE "^e: |error:|FAILED|What went wrong|Could not" build.log | head -n 200 > out/errors.log || true
          cp app/build/outputs/apk/debug/app-debug.apk out/tupo-vision-tr-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk out/tupo-vision-tr-release.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk out/tupo-vision.apk || true
          echo "${{ github.sha }} ${{ steps.build.outcome }} run=${{ github.run_number }} signing=${{ steps.signing.outputs.kind }}" > out/STATUS

      - name: Publish result to the ci branch
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tupo-vision-tr-apks
          path: |
            out/tupo-vision-tr-debug.apk
            out/tupo-vision-tr-release.apk

      - name: Publish release
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA_DEBUG=$(sha256sum out/tupo-vision-tr-debug.apk | cut -d' ' -f1)
          SHA_RELEASE=$(sha256sum out/tupo-vision-tr-release.apk | cut -d' ' -f1)
          {
            echo "Built from commit ${{ github.sha }}."
            echo
            echo "Signed with: ${{ steps.signing.outputs.kind }}"
            echo "SHA-256 (tupo-vision-tr-release.apk): $SHA_RELEASE"
            echo "SHA-256 (tupo-vision-tr-debug.apk): $SHA_DEBUG"
          } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/tupo-vision-tr-release.apk out/tupo-vision-tr-debug.apk \
            --target "${{ github.sha }}" \
            --title "Tupo Vision TR build ${{ github.run_number }}" \
            --notes-file notes.md
